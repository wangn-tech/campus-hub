name: Backend CI

on:
  pull_request:
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  push:
    branches: [main]
    paths:
      - backend/**
      - .github/workflows/backend-ci.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Cache Go modules and build cache
        # Keyed per job: the two jobs compile different build variants (the
        # race detector lives in its own cache slot), so a shared key would let
        # whichever job finishes first evict the other's cache. New branches
        # fall back to the default branch cache through the restore-keys.
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-
      - name: Check Go formatting
        run: test -z "$(gofmt -l .)"
      - name: Check shell script syntax
        run: |
          for script in scripts/*.sh; do
            bash -n "${script}"
          done
      - name: Check module metadata
        run: go mod tidy && git diff --exit-code -- go.mod go.sum
      - name: Vet
        run: go vet ./...
      - name: Test with race detector
        run: go test -race -cover ./...
      - name: Build commands
        run: go build ./cmd/server ./cmd/migrate
      - name: Validate Compose configuration
        run: docker compose -f deploy/docker/docker-compose.yml --env-file .env.example config --quiet
      - name: Verify storage backend wiring
        run: |
          resolved="$(docker compose -f deploy/docker/docker-compose.yml --env-file .env.example --profile app config)"
          echo "${resolved}" | grep -qE '^  rustfs:$'
          echo "${resolved}" | grep -q 'CAMPUSHUB_STORAGE_DRIVER: rustfs'

  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: backend/go.mod
          cache: false
      - name: Cache Go modules and build cache
        # Keyed per job, see the quality job for the rationale.
        uses: actions/cache@v5
        with:
          path: |
            ~/go/pkg/mod
            ~/.cache/go-build
          key: go-${{ runner.os }}-${{ github.job }}-${{ hashFiles('backend/go.sum') }}
          restore-keys: |
            go-${{ runner.os }}-${{ github.job }}-
            go-${{ runner.os }}-
      - name: Configure Elasticsearch kernel requirement
        run: sudo sysctl -w vm.max_map_count=262144
      - name: Run Compose integration test
        env:
          CAMPUSHUB_CI: "1"
        run: ./scripts/ci-integration.sh
