openapi: 3.0.3
info:
  title: CampusHub API
  version: 1.0.0
  description: Canonical HTTP API contract for the CampusHub backend foundation.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /ready:
    get:
      operationId: ready
      responses:
        '200':
          description: All required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user and token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/email-codes:
    post:
      operationId: sendEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, scene]
              properties:
                email: {type: string, format: email}
                scene: {type: string, enum: [register, forgot_password, logoff]}
      responses: {'200': {$ref: '#/components/responses/Success'}, '429': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    put:
      operationId: updateCurrentUser
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/users/me/interests:
    put:
      operationId: replaceInterests
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/tags:
    get:
      operationId: listInterestTags
      parameters: [{name: type, in: query, schema: {type: string, enum: [interest]}}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/files/images:
    post:
      operationId: uploadImage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, biz_type]
              properties: {file: {type: string, format: binary}, biz_type: {type: string, enum: [avatar, student_verification_front, student_verification_back, activity_cover]}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/files/{id}:
    get:
      operationId: getFileMetadata
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    delete:
      operationId: deleteFile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/student-verifications/current:
    get:
      operationId: getCurrentStudentVerification
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/student-verifications:
    post:
      operationId: submitStudentVerification
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/categories:
    get:
      operationId: listCategories
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/activities:
    get:
      operationId: listActivities
      parameters:
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: status, in: query, schema: {type: integer}}
        - {name: sort, in: query, schema: {type: string, enum: [start_time, created_at, hot]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
    post:
      operationId: createActivity
      security: [{bearerAuth: []}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityForm'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/activities/search:
    get:
      operationId: searchActivities
      parameters:
        - {name: keyword, in: query, schema: {type: string}}
        - {name: category_id, in: query, schema: {type: string, format: uuid}}
        - {name: tag_id, in: query, schema: {type: string, format: uuid}}
        - {name: start_time, in: query, schema: {type: integer, format: int64}}
        - {name: end_time, in: query, schema: {type: integer, format: int64}}
        - {name: location, in: query, schema: {type: string}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/activities/{id}:
    get:
      operationId: getActivity
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '404': {$ref: '#/components/responses/Error'}}
    put:
      operationId: updateActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/ActivityForm'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/activities/{id}/submit:
    post:
      operationId: submitActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/activities/{id}/cancel:
    post:
      operationId: cancelActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/activities/{id}/approve:
    post:
      operationId: approveActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/activities/{id}/reject:
    post:
      operationId: rejectActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/activities/{id}/send-back:
    post:
      operationId: sendBackActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me/activities/created:
    get:
      operationId: listMyCreatedActivities
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/users/me/activities/registered:
    get:
      operationId: listMyRegistrations
      security: [{bearerAuth: []}]
      parameters:
        - {name: status, in: query, schema: {type: string, enum: [upcoming, history]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/activities/{id}/registrations:
    post:
      operationId: registerForActivity
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    get:
      operationId: listActivityRegistrations
      description: Organizer or administrator only.
      security: [{bearerAuth: []}]
      parameters:
        - {$ref: '#/components/parameters/UUID'}
        - {name: status, in: query, schema: {type: string, enum: [pending, approved, rejected, cancelled, failed, expired]}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/registrations/{id}:
    get:
      operationId: getRegistration
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
    delete:
      operationId: cancelRegistration
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/registrations/{id}/approve:
    post:
      operationId: approveRegistration
      description: Organizer or administrator only. Issues the ticket.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/registrations/{id}/reject:
    post:
      operationId: rejectRegistration
      description: Organizer or administrator only. Releases the reserved slot.
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      requestBody: {required: true, content: {application/json: {schema: {type: object, required: [reason], properties: {reason: {type: string, minLength: 1, maxLength: 255}}}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
  /api/v1/tickets:
    get:
      operationId: listMyTickets
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/tickets/{id}:
    get:
      operationId: getTicket
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/check-ins:
    post:
      operationId: checkInTicket
      description: Organizer or administrator only. Supply either `code` or `ticket_id`; `client_request_id` makes the call idempotent.
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [client_request_id]
              properties:
                code: {type: string}
                ticket_id: {type: string, format: uuid}
                activity_id: {type: string, format: uuid}
                longitude: {type: number, format: double}
                latitude: {type: number, format: double}
                client_request_id: {type: string, maxLength: 64}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}, '409': {$ref: '#/components/responses/Error'}}
    get:
      operationId: listCheckIns
      description: Organizer or administrator only.
      security: [{bearerAuth: []}]
      parameters:
        - {name: activity_id, in: query, required: true, schema: {type: string, format: uuid}}
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '403': {$ref: '#/components/responses/Error'}, '404': {$ref: '#/components/responses/Error'}}
  /api/v1/notifications:
    get:
      operationId: listNotifications
      security: [{bearerAuth: []}]
      parameters:
        - {name: page, in: query, schema: {type: integer, minimum: 1}}
        - {name: page_size, in: query, schema: {type: integer, minimum: 1, maximum: 50}}
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/notifications/unread-count:
    get:
      operationId: countUnreadNotifications
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/notifications/read:
    post:
      operationId: markNotificationsRead
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids: {type: array, items: {type: string, format: uuid}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '400': {$ref: '#/components/responses/Error'}}
  /api/v1/notifications/read-all:
    post:
      operationId: markAllNotificationsRead
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    UUID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, nickname, code]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 72}
        nickname: {type: string, minLength: 1, maxLength: 50}
        code: {type: string, minLength: 6, maxLength: 6}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string}}
    ActivityForm:
      type: object
      required: [title, category_id, register_start_at, register_end_at, activity_start_at, activity_end_at, location, max_participants]
      properties:
        title: {type: string, minLength: 1, maxLength: 100}
        cover_file_id: {type: string, format: uuid}
        description: {type: string}
        category_id: {type: string, format: uuid}
        contact_phone: {type: string}
        register_start_at: {type: integer, format: int64, description: Unix milliseconds}
        register_end_at: {type: integer, format: int64, description: Unix milliseconds}
        activity_start_at: {type: integer, format: int64, description: Unix milliseconds}
        activity_end_at: {type: integer, format: int64, description: Unix milliseconds}
        location: {type: string, minLength: 1, maxLength: 200}
        address_detail: {type: string}
        longitude: {type: number, format: double}
        latitude: {type: number, format: double}
        max_participants: {type: integer, minimum: 1}
        require_approval: {type: boolean}
        require_student_verify: {type: boolean}
        min_credit_score: {type: integer, minimum: 0}
        tag_ids: {type: array, items: {type: string, format: uuid}}
        is_draft: {type: boolean, description: Create only}
    Response:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data: {nullable: true}
        trace_id: {type: string}
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    Success:
      description: Standard success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
