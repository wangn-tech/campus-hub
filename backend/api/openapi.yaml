openapi: 3.0.3
info:
  title: CampusHub API
  version: 1.0.0
  description: Canonical HTTP API contract for the CampusHub backend foundation.
servers:
  - url: /
paths:
  /health:
    get:
      operationId: health
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /ready:
    get:
      operationId: ready
      responses:
        '200':
          description: All required dependencies are ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '503':
          description: One or more dependencies are unavailable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
  /api/v1/auth/register:
    post:
      operationId: register
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: Registered user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '409':
          $ref: '#/components/responses/Error'
  /api/v1/auth/login:
    post:
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated user and token pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Response'
        '401':
          $ref: '#/components/responses/Error'
  /api/v1/email-codes:
    post:
      operationId: sendEmailCode
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, scene]
              properties:
                email: {type: string, format: email}
                scene: {type: string, enum: [register, forgot_password, logoff]}
      responses: {'200': {$ref: '#/components/responses/Success'}, '429': {$ref: '#/components/responses/Error'}}
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      requestBody: {required: true, content: {application/json: {schema: {$ref: '#/components/schemas/RefreshRequest'}}}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '401': {$ref: '#/components/responses/Error'}}
  /api/v1/users/me:
    get:
      operationId: getCurrentUser
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    put:
      operationId: updateCurrentUser
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/users/me/interests:
    put:
      operationId: replaceInterests
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/tags:
    get:
      operationId: listInterestTags
      parameters: [{name: type, in: query, schema: {type: string, enum: [interest]}}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/files/images:
    post:
      operationId: uploadImage
      security: [{bearerAuth: []}]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file, biz_type]
              properties: {file: {type: string, format: binary}, biz_type: {type: string, enum: [avatar, student_verification_front, student_verification_back, activity_cover]}}
      responses: {'200': {$ref: '#/components/responses/Success'}, '503': {$ref: '#/components/responses/Error'}}
  /api/v1/files/{id}:
    get:
      operationId: getFileMetadata
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
    delete:
      operationId: deleteFile
      security: [{bearerAuth: []}]
      parameters: [{$ref: '#/components/parameters/UUID'}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/student-verifications/current:
    get:
      operationId: getCurrentStudentVerification
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
  /api/v1/student-verifications:
    post:
      operationId: submitStudentVerification
      security: [{bearerAuth: []}]
      responses: {'200': {$ref: '#/components/responses/Success'}}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer, bearerFormat: JWT}
  parameters:
    UUID: {name: id, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    RegisterRequest:
      type: object
      required: [email, password, nickname, code]
      properties:
        email: {type: string, format: email}
        password: {type: string, minLength: 8, maxLength: 72}
        nickname: {type: string, minLength: 1, maxLength: 50}
        code: {type: string, minLength: 6, maxLength: 6}
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: {type: string, format: email}
        password: {type: string}
    RefreshRequest:
      type: object
      required: [refresh_token]
      properties: {refresh_token: {type: string}}
    Response:
      type: object
      required: [code, message, data]
      properties:
        code: {type: integer, format: int32}
        message: {type: string}
        data: {nullable: true}
        trace_id: {type: string}
    Error:
      description: Standard error response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
    Success:
      description: Standard success response
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Response'
