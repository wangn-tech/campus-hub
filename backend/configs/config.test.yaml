app:
  name: campushub
  env: test
  timezone: Asia/Shanghai
  instance_id: test
http:
  host: 127.0.0.1
  port: 18081
mysql:
  host: 127.0.0.1
  port: 13306
  username: campushub
  password: change-me
  database: campushub_test
  charset: utf8mb4
  max_open_conns: 10
  max_idle_conns: 2
  conn_max_lifetime: 5m
  log_level: warn
redis:
  host: 127.0.0.1
  port: 16379
  password: campushub_dev
  database: 0
  pool_size: 10
  min_idle_conns: 1
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
kafka:
  brokers:
    - 127.0.0.1:19092
  client_id: campushub-test
  producer_acks: all
  producer_batch_size: 100
  consumer_group: campushub-test
  chat_delivery_group_prefix: campushub.chat-delivery-test
  enable_consumers: false
  sasl_enabled: false
elasticsearch:
  addresses:
    - http://127.0.0.1:19200
  alias: activities
  index_prefix: campushub
  enable_search: true
  request_timeout: 10s
storage:
  driver: rustfs
  endpoint: 127.0.0.1:19000
  access_key: rustfsadmin
  secret_key: change-me
  bucket: campushub-test
  use_path_style: true
  use_ssl: false
  presign_ttl: 15m
  max_image_size: 5242880
mail:
  host: 127.0.0.1
  port: 1025
  from: noreply@campushub.local
  tls_mode: none
security:
  pii_encryption_key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  pii_hash_key: campushub-test-pii-hash-key
jwt:
  issuer: campushub-test
  access_secret: test-access-secret
  refresh_secret: test-refresh-secret
log:
  level: error
  encoding: json
  output: stdout
observability:
  readiness_timeout: 3s
