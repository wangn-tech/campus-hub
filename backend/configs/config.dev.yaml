app:
  name: campushub
  env: dev
  timezone: Asia/Shanghai
  instance_id: local
http:
  host: 127.0.0.1
  port: 8080
  read_timeout: 15s
  write_timeout: 15s
  idle_timeout: 60s
  shutdown_timeout: 30s
  allowed_origins:
    - http://localhost:5173
mysql:
  host: 127.0.0.1
  port: 13306
  username: campushub
  password: change-me
  database: campushub
  charset: utf8mb4
  max_open_conns: 50
  max_idle_conns: 10
  conn_max_lifetime: 30m
  log_level: warn
redis:
  host: 127.0.0.1
  port: 16379
  password: campushub_dev
  database: 0
  pool_size: 50
  min_idle_conns: 5
  dial_timeout: 5s
  read_timeout: 3s
  write_timeout: 3s
kafka:
  brokers:
    - 127.0.0.1:19092
  client_id: campushub-backend
  producer_acks: all
  producer_batch_size: 100
  consumer_group: campushub-backend
  chat_delivery_group_prefix: campushub.chat-delivery
  enable_consumers: true
  realtime_delivery_group_prefix: campushub.realtime-delivery
  sasl_enabled: false
elasticsearch:
  addresses:
    - http://127.0.0.1:19200
  alias: activities
  index_prefix: campushub
  enable_search: true
  request_timeout: 10s
storage:
  driver: rustfs
  endpoint: 127.0.0.1:19000
  access_key: rustfsadmin
  secret_key: change-me
  bucket: campushub
  use_path_style: true
  use_ssl: false
  presign_ttl: 15m
  max_image_size: 5242880
mail:
  host: 127.0.0.1
  port: 1025
  from: noreply@campushub.local
  tls_mode: none
security:
  pii_encryption_key: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
  pii_hash_key: campushub-dev-pii-hash-key
jwt:
  issuer: campushub
  access_secret: dev-access-secret-change-me
  access_ttl: 2h
  refresh_secret: dev-refresh-secret-change-me
  refresh_ttl: 720h
log:
  level: info
  encoding: console
  output: stdout
observability:
  readiness_timeout: 3s
activity:
  scheduler_interval: 1m
websocket:
  path: /ws
  read_buffer_size: 4096
  write_buffer_size: 4096
  handshake_timeout: 10s
  auth_timeout: 10s
  heartbeat_interval: 45s
  max_message_size: 4096
  allowed_origins:
    - http://localhost:5173
